<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CaptionMesh — Audience</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0d12;
    color: #f2f3f5;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 12px 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    border-bottom: 1px solid #23262e;
    font-size: 14px;
  }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  .badge {
    padding: 2px 10px;
    border-radius: 999px;
    background: #23262e;
  }
  .badge.ok { background: #14532d; }
  .badge.warn { background: #713f12; }
  .badge.err { background: #7f1d1d; }
  main { padding: 24px 20px; max-width: 800px; margin: 0 auto; }
  #live {
    min-height: 3em;
    font-size: 28px;
    line-height: 1.4;
    padding: 16px;
    border-radius: 8px;
    background: #14161c;
    border: 1px solid #23262e;
  }
  #live:empty::before {
    content: "…";
    color: #5b606b;
  }
  #history {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #history p {
    margin: 0;
    padding: 10px 14px;
    border-radius: 6px;
    background: #14161c;
    color: #c7cad1;
    font-size: 17px;
  }
  #dev-metrics {
    margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #5b606b;
  }
</style>
</head>
<body>
<header>
  <h1>CaptionMesh</h1>
  <span id="stage-badge" class="badge">stage: …</span>
  <span id="ws-badge" class="badge">connection: connecting</span>
</header>
<main>
  <div id="live"></div>
  <div id="dev-metrics"></div>
  <div id="history"></div>
</main>
<script>
(function () {
  const stageId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
  const liveEl = document.getElementById("live");
  const historyEl = document.getElementById("history");
  const wsBadge = document.getElementById("ws-badge");
  const stageBadge = document.getElementById("stage-badge");
  const devMetricsEl = document.getElementById("dev-metrics");
  const HISTORY_LIMIT = 20;

  let currentSegId = null;

  function setWsBadge(state) {
    wsBadge.textContent = "connection: " + state;
    wsBadge.className = "badge " + (state === "connected" ? "ok" : state === "disconnected" ? "err" : "warn");
  }

  function setStageBadge(status) {
    stageBadge.textContent = "stage: " + status;
    stageBadge.className = "badge " + (status === "running" ? "ok" : status === "error" ? "err" : "warn");
  }

  function addToHistory(text) {
    const p = document.createElement("p");
    p.textContent = text;
    historyEl.prepend(p);
    while (historyEl.children.length > HISTORY_LIMIT) {
      historyEl.removeChild(historyEl.lastChild);
    }
  }

  function pollStageStatus() {
    fetch("/health")
      .then((r) => r.json())
      .then((data) => setStageBadge(data.stages && data.stages[stageId] || "unknown"))
      .catch(() => setStageBadge("unknown"));
  }

  function updateDevMetrics(data) {
    const parts = [data.type === "caption.final" ? "FINAL" : "LIVE"];
    if (data.timing) {
      parts.push(`ASR ${(data.timing.asr_latency_ms / 1000).toFixed(1)}s`);
    }
    // Delivery latency assumes server and browser share a clock (true for
    // this same-host dev setup); not valid across machines with clock skew.
    const deliveryMs = Date.now() - new Date(data.ts).getTime();
    if (Number.isFinite(deliveryMs)) {
      parts.push(`delivery(same-host) ${deliveryMs}ms`);
    }
    devMetricsEl.textContent = parts.join(" · ");
  }

  function connect() {
    setWsBadge("connecting");
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${location.host}/ws/audience/${encodeURIComponent(stageId)}`);

    ws.onopen = () => setWsBadge("connected");

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "caption.interim") {
        currentSegId = data.seg_id;
        liveEl.textContent = data.text;
      } else if (data.type === "caption.final") {
        if (currentSegId === data.seg_id) {
          liveEl.textContent = "";
          currentSegId = null;
        }
        addToHistory(data.text);
      }
      updateDevMetrics(data);
    };

    ws.onclose = () => {
      setWsBadge("disconnected");
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
  pollStageStatus();
  setInterval(pollStageStatus, 5000);
})();
</script>
</body>
</html>
